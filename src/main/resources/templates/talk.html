<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <!-- Bootstrap CSS 추가 -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <style>
        /* 기존 스타일을 Bootstrap으로 개선 */
        body {
            display: flex;
            'justify-content: center;
            align-items: center;
            height: 100vh; /* 화면 전체 높이 사용 */
            background-color: #f8f9fa; /* 밝은 배경색 */
            margin-top: 50px;
        }

        #chatArea {
            width: 100%;
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            padding: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        .message {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .bubble {
            padding: 10px;
            border-radius: 10px;
            max-width: 60%;
            color: #fff;
            word-wrap: break-word;
        }

        .bubble.creator {
            background-color: #007bff;  /* 방 개설자의 말풍선 색 (파란색) */
            margin-right: auto;  /* 오른쪽으로 정렬 */
            float: left;
            text-align: left; /* 텍스트 왼쪽 정렬 */
        }

        .bubble.other {
            background-color: #28a745;  /* 다른 사용자의 말풍선 색 (녹색) */
            margin-left: auto;  /* 오른쪽으로 정렬 */
            float: right;
            text-align: left; /* 텍스트 왼쪽 정렬 */
        }

        .progress {
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        /*
        .progress-bar {
            width: 0%;
            height: 20px;
            background-color: #4caf50;
            border-radius: 5px;
        }
        */


        .progress-bar {
            width: 100%;
            background-color: #e72424;
            height: 20px;
            border-radius: 5px;
            margin-top: 10px;
            'display: none;  /* 기본적으로 숨김 */
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #007bff;
            width: 0%;
            border-radius: 5px;
        }

        .download-link {
            margin-top: 10px;
            display: block;
            color: #007bff;
            text-decoration: none;
        }

        .download-link:hover {
            text-decoration: underline;
        }






        /* 메시지 입력 필드 스타일 */
        #messageInput {
            font-size: 16px; /* 폰트 크기 설정 */
            font-family: Arial, sans-serif; /* 폰트 스타일 설정 */
            width: 100%; /* 가로 크기를 채팅 영역에 맞춤 */
        }

        /* 입력 필드와 버튼의 가운데 정렬 */
        .input-group {
            width: 50%; /* 전체 너비의 50% */
            margin: 0 auto; /* 가운데 정렬 */
        }
        /* Send 버튼 스타일 */
        #sendButton {
            position: absolute;
            right: 10px; /* 오른쪽 여백 */
            bottom: 20px; /* 아래 여백 */
        }
        #joinButton {
            position: absolute;
            right: 300px; /* 오른쪽 여백 */
            bottom: 0px; /* 아래 여백 */
        }
        #roomsButton {
            position: absolute;
            right:  0px; /* 오른쪽 여백 */
            bottom: 5px; /* 아래 여백 */
        }
        /* 입력 필드 및 버튼의 부모 요소를 flexbox로 설정 */
        .input-container {
            position: relative;
            display: flex;
            align-items: flex-end;
        }
        /* 제목 글씨 스타일 (회색) */
        h2 {
            color: gray; /* 회색으로 설정 */
        }
        /* 제목 글씨 스타일 (회색) */
        h3 {
            color: gray; /* 회색으로 설정 */
        }
        /* 제목 글씨 스타일 (회색) */
        h4 {
            color: gray; /* 회색으로 설정 */
        }
        h5 {
            color: gray; /* 회색으로 설정 */
        }
        /* 사용자 이름 입력 필드 스타일 */
        #usernameInput {
            width: 300px; /* 고정 너비 설정 */
            margin: 0 auto; /* 가운데 정렬 */
            display: block; /* block 요소로 설정 */
        }
        #participants {
            width: 200px;
            padding: 10px;
            border-right: 1px solid #ccc;
            float: left;
        }
        .participants {
            padding: 10px;
            border-radius: 20px;
            max-width: 60%;
            color: #fff;
            word-wrap: break-word;
            font-size: 14px;
        }
        .participants.creator {
            background-color: #007bff;  /* 방 개설자의 말풍선 색 (파란색) */
            margin-right: auto;  /* 오른쪽으로 정렬 */
            float: left;
            text-align: left; /* 텍스트 왼쪽 정렬 */
        }

        .participants.other {
            background-color: #28a745;  /* 다른 사용자의 말풍선 색 (녹색) */
            margin-left: auto;  /* 오른쪽으로 정렬 */
            float: right;
            text-align: left; /* 텍스트 왼쪽 정렬 */
        }
    </style>

</head>
<body>
<div class="container text-center">
    <h5>[[${roomName}]]</h5>
    <input type="text" id="usernameInput" class="form-control" placeholder="Enter your name" />
    <div class="input-container">
        <button id="joinButton" class="btn btn-info mt-2">Join Room</button>
        <button id="roomsButton" class="btn btn-info mt-2" onclick="window.location.href='/rooms'" style="display: none;">Rooms</button>
    </div>

    <div id="chatContainer" style="display:none;">
        <!-- 채팅 메시지를 표시할 div -->
        <div id="chatArea"></div>
        <div id="participantsArea"></div>
        <!--<ul id="participantsArea"></ul>-->
        <br>
        <br>

        <!-- 메시지 입력 부분 -->
        <div class="input-container">
        <textarea id="messageInput" class="form-control" placeholder="Type a message..." rows="3"></textarea>
        <button id="sendButton" class="btn btn-info">Send</button>
        </div>
        <br>

        <!-- 파일 선택 -->
        <!--
        <input type="file" id="fileInput" class="mt-2" />
        <button id="sendFileButton" class="btn btn-info mt-2">Send File</button>
        -->

        <!-- Progress Bar 추가 -->
        <div class="progress" id="progressBar">
            <div class="progress-bar" id="progressBarFill"></div>
        </div>

        <!-- Download Link 추가 -->
        <!--<a id="downloadLink" style="display: none;">Download File</a>-->
    </div>
</div>



<script>
    var roomId = '[[${roomId}]]';  // roomId에 싱글 쿼테이션 추가
    var webSocket;
    var username = ''; // 사용자 이름을 저장할 변수
    var isCreator = false; // 방 개설자인지 여부
    const CHUNK_SIZE = 32 * 1024;  // 32KB 크기로 파일을 나눔
    var chatarea ='';
    var progressBar = document.getElementById("progressBar");
    var progressBarFill = document.getElementById("progressBarFill");
    //var downloadLink = document.getElementById("downloadLink");
    var receivedChunks = [];  // 수신된 chunk를 저장할 배열
    var totalChunks = 0;      // 전체 chunk 수
    var currentChunk = 0;     // 현재 수신 중인 chunk 인덱스
    // 참가자 목록을 표시할 DOM 요소
    const participantsArea = document.getElementById("participantsArea");

    // 랜덤 문자열 생성 함수
    function generateRandomString(length, isUppercase) {
        const characters = isUppercase ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' : 'abcdefghijklmnopqrstuvwxyz';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result;
    }





    // 페이지 로드 시 랜덤한 사용자 이름을 입력 필드에 설정
    window.onload = function() {
        const usernameInput = document.getElementById('usernameInput');
        const randomUsername = generateRandomString(6, false);  // 소문자 6글자 사용자 이름 생성
        usernameInput.value = randomUsername;
    };

    // 대화방에 입장 버튼 클릭 이벤트
    document.getElementById("joinButton").addEventListener("click", function() {

        document.getElementById("usernameInput").style.display = "none";
        document.getElementById("joinButton").style.display = "none";
        document.getElementById("roomsButton").style.display = "block";

        username = document.getElementById("usernameInput").value.trim();
        if (username) {
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                console.warn("Already connected to a WebSocket.");
                return; // 이미 연결된 경우 중지
            }
            webSocket = new WebSocket('ws://localhost:8080/chat/' + roomId);

            webSocket.binaryType = 'arraybuffer';

            document.getElementById("chatContainer").style.display = "block"; // 채팅 컨테이너 표시

            // WebSocket이 연결되면 사용자 이름을 전송
            webSocket.onopen = function() {
                console.log(username + ' has joined the room.');

                // 방 개설자인지 확인
                if (document.getElementById("chatArea").children.length === 0) {
                    isCreator = true;
                }

                if (username) {
                    const data = JSON.stringify({ messageType: "setUsername", username: username });
                    webSocket.send(data);
                }
            };

            // WebSocket 오류 처리
            webSocket.onerror = function(event) {
                console.error("WebSocket error observed:", event);
            };

            // WebSocket 닫힘 처리
            webSocket.onclose = function(event) {
                console.log("WebSocket connection closed:", event);
            };

            // 메시지 수신
            webSocket.onmessage = function(event) {
                var chatArea = document.getElementById("chatArea");
                var data = '';
                try {
                    data = JSON.parse(event.data);
                } catch (e) {
                    data = { type: 'file' };
                }

                if(Array.isArray(data)){
                    updateParticipants(data);//참가자 목록 갱신
                }
                else if (data.type == 'file' || data.type == 'fileMeta') {
                    if (data.type == 'fileMeta') {
                        totalChunks = data.totalChunks;
                        if (data.chunkIndex >= totalChunks) {
                            var completeFile = new Blob(receivedChunks);
                            var downloadUrl = URL.createObjectURL(completeFile);  // Blob을 URL로 변환
                            //downloadLink.href = downloadUrl;
                            //downloadLink.download = data.fileName;  // 파일 이름 설정
                            //downloadLink.style.display = 'block';  // 다운로드 링크 표시
                            //downloadLink.innerHTML = 'Download File: ' + data.fileName;  // 링크 텍스트 설정
                            progressBar.style.display = 'none';
                            currentChunk = 0;
                            totalChunks = 0;


                            //chatarea에 추가
                            //----------------------------------------------------------
                            const downloadLinkChat = document.createElement('a');
                            downloadLinkChat.href = downloadUrl;  // 서버에서 파일 다운로드 경로
                            downloadLinkChat.download = data.fileName
                            downloadLinkChat.textContent = 'Download ' + data.fileName;
                            downloadLinkChat.classList.add('download-link');
                            //downloadLink.innerHTML = 'Download File: ' + data.fileName;
                            const chatMessage = document.createElement('div');
                            chatMessage.appendChild(downloadLinkChat);
                            chatArea.appendChild(chatMessage);

                            receivedChunks = [];
                            //----------------------------------------------------------

                        }
                    } else {
                        currentChunk++;
                        receivedChunks.push(new Uint8Array(event.data));
                        var progress = (currentChunk / totalChunks) * 100;
                        progressBar.style.display = 'block';
                        progressBarFill.style.width = progress + '%';
                    }
                } else {
                    var messageBubble = document.createElement('div');
                    var bubbleClass = data.username === username && isCreator ? 'creator' : 'other';
                    messageBubble.className = 'message ' + bubbleClass;
                    var bubble = document.createElement('div');
                    bubble.className = 'bubble ' + bubbleClass;
                    bubble.innerText = data.username + ": " + data.message;
                    messageBubble.appendChild(bubble);
                    chatArea.appendChild(messageBubble);
                    chatArea.scrollTop = chatArea.scrollHeight; // 스크롤을 항상 맨 아래로 이동
                }
            };
            // 참가자 목록을 화면에 업데이트하는 함수
            function updateParticipants(participants) {
                // 참석자표기
                //attendees = document.getElementById("attendees");
                //var attendee = document.createElement('div');
                //var bubbleClass = 'creator';
                //attendee.className = 'bubble ' + bubbleClass;
                //attendee.innerText = username;
                //attendees.appendChild(attendee);

                participantsArea.innerHTML = "";  // 이전 목록 초기화
                participants.forEach(participant => {
                    const participantElement = document.createElement("div");
                    var participantClass = username === participant ? 'creator' : 'other';
                    participantElement.className = 'participants ' + participantClass;
                    participantElement.textContent = participant;
                    participantsArea.appendChild(participantElement);
                });
            }
            // 메시지 전송 함수
            function sendMessage() {
                var messageInput = document.getElementById("messageInput");
                var message = messageInput.value.trim();

                if (message) {
                    var data = { messageType: 'chat', username: username, message: message };
                    if (webSocket.readyState === WebSocket.OPEN) {
                        webSocket.send(JSON.stringify(data));  // WebSocket을 통해 JSON 형태로 전송
                    } else {
                        console.error("WebSocket is not open. Message not sent.");
                    }

                    messageInput.value = '';  // 입력 필드 초기화
                }
            }

            // "Send" 버튼에 클릭 이벤트 리스너 추가
            document.getElementById("sendButton").addEventListener("click", sendMessage);

            // Enter 키를 눌렀을 때 메시지 전송
            document.getElementById("messageInput").addEventListener("keypress", function(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();  // 줄 바꿈 방지
                    sendMessage();  // 메시지 전송
                }
            });



            // 파일 전송 버튼 클릭 이벤트
            /*
            document.getElementById("sendFileButton").addEventListener("click", function() {
                var fileInput = document.getElementById("fileInput");
                var file = fileInput.files[0]; // 사용자가 선택한 파일
                if (file) {
                    sendFile(file);
                } else {
                    alert('Please select a file first.');
                }
            });
             */
            chatarea = document.getElementById('chatArea');

            // 드래그앤드랍 이벤트 설정
            // -------------------------------------------------------------
            chatarea.addEventListener('dragover', (event) => {
                console.log("dragover configured!");
                event.preventDefault();
                chatarea.style.border = '2px dashed #007bff';  // 파일이 위에 있을 때 스타일 변경
            });

            chatarea.addEventListener('dragleave', () => {
                console.log("dragleave configured!");
                chatarea.style.border = '';  // 스타일 초기화
            });

            chatarea.addEventListener('drop', (event) => {
                console.log("drop configured!");
                event.preventDefault();
                chatarea.style.border = '';  // 스타일 초기화
                const files = event.dataTransfer.files;
                if (files.length > 0) {
                    for (let i = 0; i < files.length; i++) {
                        sendFile(files[i]);  // 각 파일에 대해 파일 전송 로직 호출
                    }
                }
            });
            // -------------------------------------------------------------


            // 파일 전송 함수
            function sendFile(file) {
                var reader = new FileReader();
                var offset = 0;  // 현재 읽고 있는 파일의 오프셋
                totalChunks = Math.ceil(file.size / CHUNK_SIZE); // 전체 chunk 수 계산

                reader.onload = function(event) {
                    var chunkData = event.target.result;  // 현재 chunk 데이터

                    if (webSocket.readyState === WebSocket.OPEN) {
                        webSocket.send(chunkData);
                    } else {
                        console.error("WebSocket is not open. File chunk not sent.");
                    }

                    offset += CHUNK_SIZE;  // 다음 chunk를 읽기 위한 오프셋 증가

                    var progress = (offset / file.size) * 100;
                    progressBar.style.display = 'block';
                    progressBarFill.style.width = progress + '%';
                    console.log(progress + '%');

                    if (offset < file.size) {
                        readChunk();  // 다음 chunk 읽기
                    } else {
                        // 파일 전송 완료 후 메타 정보 전송
                        if (webSocket.readyState === WebSocket.OPEN) {
                            webSocket.send(JSON.stringify({
                                type: 'fileMeta',
                                username: username,
                                fileName: file.name,
                                totalChunks: totalChunks,
                                chunkIndex: Math.floor(offset / CHUNK_SIZE)
                            }));
                        }
                        //progressBar.style.display = 'none';  // 진행률 숨기기
                        //addDownloadLink(file.name);  // 파일 다운로드 링크 추가
                    }
                };

                function readChunk() {
                    var blob = file.slice(offset, offset + CHUNK_SIZE);  // 파일의 특정 범위 자르기
                    reader.readAsArrayBuffer(blob);  // 잘라낸 범위를 ArrayBuffer로 읽기
                }

                // 파일 전송 시작 시 메타 정보 전송
                if (webSocket.readyState === WebSocket.OPEN) {
                    webSocket.send(JSON.stringify({
                        type: 'fileMeta',
                        username: username,
                        fileName: file.name,
                        totalChunks: totalChunks,
                        chunkIndex: Math.floor(offset / CHUNK_SIZE)
                    }));
                }
                readChunk();  // 첫 번째 chunk 읽기 시작
            }

        } else {
            alert("Please enter your name.");
        }
    });
</script>
</body>
</html>
